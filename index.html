<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>imToken 终极完美复刻</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- 更换为渲染精度更高的 html-to-image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        :root {
            --theme-blue: #007AFF; /* 精准的苹果蓝 */
            --card-bg: #ffffff;
            --text-main: #1A1A1A;
            --text-sub: #8E8E93;
            --tron-red: #FF5A5A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== 控制面板 ===== */
        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: var(--theme-blue); }

        .save-btn {
            width: 100%; background-color: var(--theme-blue); color: white; border: none; padding: 14px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s;
        }
        .save-btn:active { opacity: 0.8; }

        /* ===== 核心卡片区域 ===== */
        .card-wrapper {
            background-color: var(--theme-blue);
            width: 100%; max-width: 400px; border-radius: 20px;
            padding: 16px; /* 蓝色外框的厚度 */
            position: relative;
        }

        .white-card {
            background-color: var(--card-bg); border-radius: 16px;
            padding: 32px 20px 24px; /* 内部白卡的边距 */
            text-align: center; display: flex; flex-direction: column; align-items: center;
            margin-bottom: 20px; /* 白卡与底部蓝区的间距 */
        }

        .tron-badge {
            display: inline-flex; align-items: center; border: 1px solid #E5E5EA; border-radius: 20px;
            padding: 4px 12px; margin-bottom: 16px;
        }
        .tron-icon {
            width: 20px; height: 20px; background-color: var(--tron-red); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin-right: 6px;
        }
        .tron-icon svg { width: 10px; height: 10px; fill: white; }
        .tron-badge span { font-size: 15px; color: var(--text-main); font-weight: 500; }

        .subtitle { font-size: 15px; color: var(--text-sub); margin-bottom: 24px; }

        .qr-box {
            border: 1px solid #F2F2F7; border-radius: 16px; padding: 12px;
            margin-bottom: 24px; background: #fff; width: 240px; height: 240px;
            display: flex; justify-content: center; align-items: center;
        }

        .address-label { font-size: 14px; color: var(--text-sub); margin-bottom: 8px; }
        .address-text { font-size: 16px; color: var(--text-main); font-weight: 600; word-break: break-all; line-height: 1.5; }

        /* ===== 底部 imToken 栏 ===== */
        .footer-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 12px 8px 12px; color: #fff;
        }

        .footer-left { display: flex; align-items: center; gap: 10px; }

        /* 使用极其精准的底栏纯白矢量图 */
        .footer-logo {
            width: 34px; height: 34px; fill: #ffffff;
            /* 强制精准渲染，防止截图插件糊掉 */
            shape-rendering: geometricPrecision; 
        }

        .footer-text h4 { font-size: 18px; font-weight: 500; margin-bottom: 2px; }
        .footer-text p { font-size: 12px; color: rgba(255, 255, 255, 0.85); }

        .footer-qr {
            background: #fff; padding: 2px; border-radius: 6px; width: 46px; height: 46px;
            display: flex; justify-content: center; align-items: center;
        }
        .footer-qr img { width: 100%; height: 100%; display: block; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="form-group">
            <label>二维码内容 (输入您的支付网址)</label>
            <input type="text" id="qrContentInput" value="https://cs-8kc.pages.dev">
        </div>
        <div class="form-group">
            <label>卡片显示的收款地址</label>
            <input type="text" id="addressInput" value="TLsgrS8KPwtmVWx3YZiWQ5hcRRUfkxGBo1">
        </div>
        <button class="save-btn" id="saveBtn">保存为高清图片</button>
    </div>

    <!-- 截图区域 -->
    <div class="card-wrapper" id="cardCapture">
        <div class="white-card">
            <div class="tron-badge">
                <div class="tron-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 15 10-15-10-5zm0 2.3l6.7 3.35-6.7 10.05-6.7-10.05L12 4.3z"/></svg>
                </div>
                <span>Tron</span>
            </div>
            <p class="subtitle">仅支持 Tron 资产 (TRC10/TRC20)</p>
            <div class="qr-box" id="mainQrContainer"></div>
            <p class="address-label">钱包地址</p>
            <p class="address-text" id="displayAddress">TLsgrS8KPwtmVWx3YZiWQ5hcRRUfkxGBo1</p>
        </div>

        <div class="footer-bar">
            <div class="footer-left">
                <!-- 极其精准的 imToken 官方 Logo 路径 -->
                <svg class="footer-logo" viewBox="0 0 1024 1024">
                    <path d="M752.6 412.7c-25.6-94.7-114.3-164.6-219.3-164.6-125.2 0-226.8 101.5-226.8 226.8 0 11.4 0.9 22.7 2.5 33.7 2.5 17.9 12.7 33.9 27.8 43.5 42.1 26.6 92.9 17.7 126.7-17.2 8.8-9.1 19.4-16.4 31.6-21 17.5-6.7 36.6-5.8 53.5 2.1 16.6 7.8 30.6 20.5 40 36.5 22.3 38 69 58.8 112.7 47.7 43.8-11.2 76.3-47.9 81.8-92.7 1.4-11.1 2.1-22.4 2.1-33.8 0-21.9-2.9-43.2-8.6-63.6l-24 2.6zM512 151.3C312.8 151.3 151.3 312.8 151.3 512S312.8 872.7 512 872.7 872.7 711.2 872.7 512 711.2 151.3 512 151.3z m0 661.9c-166.6 0-301.9-135.3-301.9-301.9S345.4 210.1 512 210.1 813.9 345.4 813.9 512 678.6 813.2 512 813.2z"></path>
                </svg>
                <div class="footer-text">
                    <h4>imToken</h4>
                    <p>https://token.im</p>
                </div>
            </div>
            <div class="footer-qr">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://token.im&margin=0" alt="固定二维码">
            </div>
        </div>
    </div>

    <script>
        const mainQrContainer = document.getElementById('mainQrContainer');
        const saveBtn = document.getElementById('saveBtn');
        const cardCapture = document.getElementById('cardCapture');

        function generateMainQRCode(text) {
            if (!text) return;
            mainQrContainer.innerHTML = '';
            new QRCode(mainQrContainer, {
                text: text, width: 220, height: 220, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
            mainQrContainer.style.display = 'flex';
            mainQrContainer.style.justifyContent = 'center';
            mainQrContainer.style.alignItems = 'center';
        }

        document.getElementById('qrContentInput').addEventListener('input', (e) => generateMainQRCode(e.target.value.trim()));
        document.getElementById('addressInput').addEventListener('input', (e) => { document.getElementById('displayAddress').innerText = e.target.value.trim(); });

        // 使用 html-to-image 进行截图
        saveBtn.addEventListener('click', function() {
            const originalText = saveBtn.innerText;
            saveBtn.innerText = '正在生成...';
            saveBtn.disabled = true;

            // pixelRatio: 4 表示4倍高清
            htmlToImage.toPng(cardCapture, { pixelRatio: 4, backgroundColor: null })
                .then(function (dataUrl) {
                    const link = document.createElement('a');
                    link.download = 'Tron_完美复刻.png';
                    link.href = dataUrl;
                    link.click();
                    saveBtn.innerText = originalText;
                    saveBtn.disabled = false;
                })
                .catch(function (error) {
                    console.error('截图失败:', error);
                    alert('生成失败，请重试。');
                    saveBtn.innerText = originalText;
                    saveBtn.disabled = false;
                });
        });

        window.onload = () => {
            generateMainQRCode(document.getElementById('qrContentInput').value);
        };
    </script>
</body>
</html>
