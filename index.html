<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>imToken 完美复刻生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --theme-blue: #0076FF;
            --card-bg: #ffffff;
            --text-main: #1A1A1A;
            --text-sub: #8E8E93;
            --tron-red: #FF5A5A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== 控制面板 ===== */
        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
            z-index: 10;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--theme-blue); }

        .save-btn {
            width: 100%; background-color: var(--theme-blue); color: white; border: none; padding: 14px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s;
        }
        .save-btn:active { opacity: 0.8; }
        .save-btn:disabled { background-color: #999; cursor: not-allowed; }

        /* ===== 核心卡片区域 (截图目标) ===== */
        .card-wrapper {
            background-color: var(--theme-blue);
            width: 100%; max-width: 420px; border-radius: 28px; padding: 16px;
            position: relative; box-shadow: 0 10px 30px rgba(0,118,255,0.2);
        }

        .white-card {
            background-color: var(--card-bg); border-radius: 20px; padding: 35px 20px 30px;
            text-align: center; display: flex; flex-direction: column; align-items: center; margin-bottom: 24px;
        }

        .tron-badge {
            display: inline-flex; align-items: center; border: 1px solid #E5E5EA; border-radius: 24px;
            padding: 6px 16px; margin-bottom: 20px;
        }

        .tron-icon {
            width: 22px; height: 22px; background-color: var(--tron-red); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin-right: 8px;
        }

        .tron-icon svg { width: 12px; height: 12px; fill: white; }
        .tron-badge span { font-size: 16px; color: var(--text-main); font-weight: 500; }

        .subtitle { font-size: 16px; color: var(--text-sub); margin-bottom: 30px; letter-spacing: 0.5px; }

        .qr-box {
            border: 1px solid #F2F2F7; border-radius: 20px; padding: 16px; margin-bottom: 30px;
            background: #fff; width: 260px; height: 260px; display: flex; justify-content: center; align-items: center;
        }

        .address-label { font-size: 15px; color: var(--text-sub); margin-bottom: 10px; }
        .address-text { font-size: 17px; color: var(--text-main); font-weight: 600; word-break: break-all; line-height: 1.5; padding: 0 10px; }

        /* ===== 底部 imToken 栏 (完美像素级还原) ===== */
        .footer-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 12px 8px 16px; color: #fff;
        }

        .footer-left { display: flex; align-items: center; }

        /* 采用官方底层的纯白完美水滴实心路径 */
        .footer-logo {
            width: 38px; height: 38px; margin-right: 10px;
            fill: #ffffff;
        }

        .footer-text h4 { font-size: 20px; font-weight: 500; margin-bottom: 4px; letter-spacing: 0.5px; line-height: 1.2; }
        .footer-text p { font-size: 14px; color: rgba(255, 255, 255, 0.85); letter-spacing: 0.5px; line-height: 1.2; }

        /* 右下角小二维码 (紧贴边距) */
        .footer-qr {
            background: #fff; padding: 3px; border-radius: 8px; width: 54px; height: 54px;
            display: flex; justify-content: center; align-items: center;
        }
        .footer-qr img { width: 100%; height: 100%; display: block; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="form-group">
            <label>中间大二维码内容 (扫码跳转的网址)</label>
            <input type="text" id="qrContentInput" placeholder="输入您的支付网址" value="https://cs-8kc.pages.dev">
        </div>
        <div class="form-group">
            <label>卡片显示的收款地址</label>
            <input type="text" id="addressInput" placeholder="输入 Tron 钱包地址" value="TLsgrS8KPwtmVWx3YZiWQ5hcRRUfkxGBo1">
        </div>
        
        <button class="save-btn" id="saveBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            保存为高清图片
        </button>
    </div>

    <!-- 卡片渲染区 -->
    <div class="card-wrapper" id="cardCapture">
        <div class="white-card">
            <div class="tron-badge">
                <div class="tron-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 15 10-15-10-5zm0 2.3l6.7 3.35-6.7 10.05-6.7-10.05L12 4.3z"/></svg>
                </div>
                <span>Tron</span>
            </div>

            <p class="subtitle">仅支持 Tron 资产 (TRC10/TRC20)</p>

            <div class="qr-box" id="mainQrContainer"></div>

            <p class="address-label">钱包地址</p>
            <p class="address-text" id="displayAddress">TLsgrS8KPwtmVWx3YZiWQ5hcRRUfkxGBo1</p>
        </div>

        <div class="footer-bar">
            <div class="footer-left">
                <!-- 完美还原图三的实心纯白 Logo -->
                <svg class="footer-logo" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                    <path d="M736 379.2c-25.6-46.4-61.6-85.6-104.8-114.4-53.6-35.6-116.8-54.4-182.4-54.4-90.4 0-176.8 36.8-240 103.2-64 67.2-95.2 156.8-87.2 248.8 8 93.6 54.4 180.8 128 240.8 46.4 37.6 102.4 62.4 162.4 71.2 22.4 3.2 44.8 4.8 67.2 4.8 123.2 0 239.2-56 316.8-152 1.6-2.4 3.2-4.8 4.8-7.2-44.8-22.4-78.4-61.6-94.4-108.8-8.8-25.6-11.2-52.8-7.2-79.2 4.8-32.8 19.2-64 41.6-88.8 8.8-9.6 18.4-18.4 28.8-26.4-12-8-24-15.2-36-21.6z M418.4 619.2c-34.4 0-62.4-28-62.4-62.4s28-62.4 62.4-62.4 62.4 28 62.4 62.4-28 62.4-62.4 62.4z"/>
                </svg>
                <div class="footer-text">
                    <h4>imToken</h4>
                    <p>https://token.im</p>
                </div>
            </div>
            
            <div class="footer-qr">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://token.im&margin=0" alt="固定二维码">
            </div>
        </div>
    </div>

    <script>
        const qrContentInput = document.getElementById('qrContentInput');
        const addressInput = document.getElementById('addressInput');
        const displayAddress = document.getElementById('displayAddress');
        const mainQrContainer = document.getElementById('mainQrContainer');
        const saveBtn = document.getElementById('saveBtn');
        const cardCapture = document.getElementById('cardCapture');

        function generateMainQRCode(text) {
            if (!text) return;
            mainQrContainer.innerHTML = '';
            new QRCode(mainQrContainer, {
                text: text, width: 256, height: 256, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
            mainQrContainer.style.display = 'flex';
            mainQrContainer.style.justifyContent = 'center';
            mainQrContainer.style.alignItems = 'center';
        }

        qrContentInput.addEventListener('input', (e) => generateMainQRCode(e.target.value.trim()));
        addressInput.addEventListener('input', (e) => { displayAddress.innerText = e.target.value.trim(); });

        saveBtn.addEventListener('click', function() {
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '正在生成...';
            saveBtn.disabled = true;

            html2canvas(cardCapture, {
                scale: 4, useCORS: true, backgroundColor: null, logging: false
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = 'Tron_收款卡片_完美版.png';
                link.href = imgData;
                link.click();
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }).catch(err => {
                console.error('截图失败:', err);
                alert('生成失败，请重试。');
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            });
        });

        window.onload = () => {
            generateMainQRCode(qrContentInput.value);
            displayAddress.innerText = addressInput.value;
        };
    </script>
</body>
</html>
