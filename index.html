<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>imToken 完美复刻生成器</title>
    <!-- 引入二维码生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- 引入更稳定的截图库 html-to-image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        :root {
            --theme-blue: #007AFF;
            --card-bg: #ffffff;
            --text-main: #1A1A1A;
            --text-sub: #8E8E93;
            --tron-red: #FF5A5A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== 控制面板 ===== */
        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s;
        }
        .form-group input:focus { border-color: var(--theme-blue); }

        .save-btn {
            width: 100%; background-color: var(--theme-blue); color: white; border: none; padding: 14px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s;
        }
        .save-btn:active { opacity: 0.8; }

        /* ===== 核心卡片区域 ===== */
        .card-wrapper {
            background-color: var(--theme-blue);
            width: 100%; max-width: 400px; 
            border-radius: 24px;
            padding: 16px; /* 外框厚度 */
            position: relative;
        }

        .white-card {
            background-color: var(--card-bg); 
            border-radius: 16px;
            padding: 32px 20px 24px; 
            text-align: center; 
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 20px; 
        }

        .tron-badge {
            display: inline-flex; align-items: center; border: 1px solid #E5E5EA; border-radius: 20px;
            padding: 4px 12px; margin-bottom: 16px;
        }
        .tron-icon {
            width: 20px; height: 20px; background-color: var(--tron-red); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin-right: 6px;
        }
        .tron-icon svg { width: 10px; height: 10px; fill: white; }
        .tron-badge span { font-size: 15px; color: var(--text-main); font-weight: 500; }

        .subtitle { font-size: 15px; color: var(--text-sub); margin-bottom: 24px; letter-spacing: 0.5px; }

        .qr-box {
            border: 1px solid #F2F2F7; border-radius: 16px; padding: 12px;
            margin-bottom: 24px; background: #fff; width: 240px; height: 240px;
            display: flex; justify-content: center; align-items: center;
        }

        .address-label { font-size: 14px; color: var(--text-sub); margin-bottom: 8px; }
        .address-text { font-size: 16px; color: var(--text-main); font-weight: 600; word-break: break-all; line-height: 1.5; padding: 0 10px;}

        /* ===== 底部 imToken 栏 ===== */
        .footer-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px 6px 14px; 
        }

        .footer-left { display: flex; align-items: center; }

        /* 已内嵌 Base64 完美 Logo */
        .footer-logo {
            width: 36px; height: 36px; margin-right: 12px;
            object-fit: contain;
        }

        .footer-text h4 { font-size: 19px; font-weight: 500; color: #fff; margin-bottom: 2px; line-height: 1.2; letter-spacing: 0.5px;}
        .footer-text p { font-size: 13px; color: rgba(255, 255, 255, 0.85); line-height: 1.2; letter-spacing: 0.5px;}

        .footer-qr {
            background: #fff; padding: 3px; border-radius: 8px; width: 52px; height: 52px;
            display: flex; justify-content: center; align-items: center;
        }
        .footer-qr img { width: 100%; height: 100%; display: block; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="form-group">
            <label>二维码内容 (输入您的支付网址)</label>
            <input type="text" id="qrContentInput" value="https://cs-8kc.pages.dev">
        </div>
        <div class="form-group">
            <label>卡片显示的收款地址</label>
            <input type="text" id="addressInput" value="TLsgrS8KPwtmVWx3YZiWQ5hcRRUfkxGBo1">
        </div>
        <button class="save-btn" id="saveBtn">保存为高清图片</button>
    </div>

    <!-- 卡片渲染区 -->
    <div class="card-wrapper" id="cardCapture">
        <div class="white-card">
            <div class="tron-badge">
                <div class="tron-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 15 10-15-10-5zm0 2.3l6.7 3.35-6.7 10.05-6.7-10.05L12 4.3z"/></svg>
                </div>
                <span>Tron</span>
            </div>
            <p class="subtitle">仅支持 Tron 资产 (TRC10/TRC20)</p>
            
            <div class="qr-box" id="mainQrContainer"></div>
            
            <p class="address-label">钱包地址</p>
            <p class="address-text" id="displayAddress">TLsgrS8KPwtmVWx3YZiWQ5hcRRUfkxGBo1</p>
        </div>

        <div class="footer-bar">
            <div class="footer-left">
                <!-- 直接把图片数据写在 src 里，无视任何文件路径限制 -->
                <img class="footer-logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDI0IDEwMjQiPjxwYXRoIGZpbGw9IiNmZmZmZmYiIGQ9Ik03NTEuOCAzNTYuNmwtMjIuNi0xMi4yYy0xMTYuMS02Mi42LTI1MS42LTUwLjItMzU2LjEgMzIuMi0xMDUuNyA4My42LTE1Mi4zIDIyMy43LTExNi4xIDM1MS4yIDI3LjYgOTcuNSAxMDQuMiAxNzIuNSAyMDMuNSAxOTkuMyAxMjEuMyAzMi42IDI1MS0xMi42IDMyNi4xLTExMS45IDI2LjgtMzUuNCA0NS44LTc1LjMgNTUuNy0xMTcuNiA5LjktNDIuMyAxMC0xODYuMiAxMC0xODYuMiAwIDAtODAuMS0xNDUuOC0xMDAuNS0xNTQuOHptLTExMC45IDMzMC4xYy0xNy42IDIzLjMtNDIuNiA0MS4xLTcwLjggNTEuNC0zMS42IDExLjUtNjYuMiAxMi45LTk4LjEgNC00MS4xLTEuMS04MS41LTE2LjItMTE0LjItNDMuNC0zMy0yNy4zLTU2LjItNjQuMS02NS45LTEwNS44LTExLjItNDkuNi0yLjgtMTAyLjMgMjIuOC0xNDYuMiAyNS42LTQzLjkgNjYuNS03Ny4yIDExNC4yLTkzLjIgNDAuNS0xMy42IDg1LjItMTQuNCAxMjYuNS0yLjIgMzQuMyAxMC4xIDY1LjQgMjkuNyA4OC40IDU2LjIgMjcuNiAyNi41IDQ4LjcgNTkuNyA2Mi4yIDk2LjIgMTEuMiAzMC4xIDE1LjEgNjIuMiAxMSA5My41LTMuOSAzMS4yLTE2IDYwLjYtMzQuMiA4NS45LTE0LjkgMjAuNy0zMy4xIDM4LjYtNTMuOCA1My41bDEyLjQgMTEuMXoiLz48L3N2Zz4=" alt="imToken">
                <div class="footer-text">
                    <h4>imToken</h4>
                    <p>https://token.im</p>
                </div>
            </div>
            
            <div class="footer-qr">
                <!-- 右下角二维码也做了跨域处理 -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://token.im&margin=0" alt="固定二维码" crossorigin="anonymous">
            </div>
        </div>
    </div>

    <script>
        const mainQrContainer = document.getElementById('mainQrContainer');
        const saveBtn = document.getElementById('saveBtn');
        const cardCapture = document.getElementById('cardCapture');

        function generateMainQRCode(text) {
            if (!text) return;
            mainQrContainer.innerHTML = '';
            new QRCode(mainQrContainer, {
                text: text, width: 220, height: 220, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
            mainQrContainer.style.display = 'flex';
            mainQrContainer.style.justifyContent = 'center';
            mainQrContainer.style.alignItems = 'center';
        }

        document.getElementById('qrContentInput').addEventListener('input', (e) => generateMainQRCode(e.target.value.trim()));
        document.getElementById('addressInput').addEventListener('input', (e) => { 
            document.getElementById('displayAddress').innerText = e.target.value.trim(); 
        });

        saveBtn.addEventListener('click', function() {
            const originalText = saveBtn.innerText;
            saveBtn.innerText = '正在生成图片...';
            saveBtn.disabled = true;

            // 加上延迟，确保 Base64 图片渲染完毕
            setTimeout(() => {
                htmlToImage.toPng(cardCapture, { pixelRatio: 4, backgroundColor: null })
                    .then(function (dataUrl) {
                        const link = document.createElement('a');
                        link.download = 'Tron_完美收款卡片.png';
                        link.href = dataUrl;
                        link.click();
                        
                        saveBtn.innerText = originalText;
                        saveBtn.disabled = false;
                    })
                    .catch(function (error) {
                        console.error('截图失败:', error);
                        alert('生成失败，请检查网络后重试。');
                        saveBtn.innerText = originalText;
                        saveBtn.disabled = false;
                    });
            }, 100); // 延迟 0.1 秒
        });

        window.onload = () => {
            generateMainQRCode(document.getElementById('qrContentInput').value);
        };
    </script>
</body>
</html>
