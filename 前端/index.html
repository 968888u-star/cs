<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>imToken 完美复刻生成器</title>
    <!-- 引入二维码生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- 引入更稳定的截图库 html-to-image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        :root {
            --theme-blue: #007AFF; /* 原图取色 */
            --card-bg: #ffffff;
            --text-main: #1A1A1A;
            --text-sub: #8E8E93;
            --tron-red: #FF5A5A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== 控制面板 ===== */
        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s;
        }
        .form-group input:focus { border-color: var(--theme-blue); }

        .save-btn {
            width: 100%; background-color: var(--theme-blue); color: white; border: none; padding: 14px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s;
        }
        .save-btn:active { opacity: 0.8; }

        /* ===== 核心卡片区域 (截图目标) ===== */
        .card-wrapper {
            background-color: var(--theme-blue);
            width: 100%; max-width: 400px; 
            border-radius: 24px;
            padding: 16px; /* 蓝色外框厚度 */
            position: relative;
        }

        .white-card {
            background-color: var(--card-bg); 
            border-radius: 16px;
            padding: 32px 20px 24px; 
            text-align: center; 
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 20px; 
        }

        .tron-badge {
            display: inline-flex; align-items: center; border: 1px solid #E5E5EA; border-radius: 20px;
            padding: 4px 12px; margin-bottom: 16px;
        }
        .tron-icon {
            width: 20px; height: 20px; background-color: var(--tron-red); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin-right: 6px;
        }
        .tron-icon svg { width: 10px; height: 10px; fill: white; }
        .tron-badge span { font-size: 15px; color: var(--text-main); font-weight: 500; }

        .subtitle { font-size: 15px; color: var(--text-sub); margin-bottom: 24px; letter-spacing: 0.5px; }

        .qr-box {
            border: 1px solid #F2F2F7; border-radius: 16px; padding: 12px;
            margin-bottom: 24px; background: #fff; width: 240px; height: 240px;
            display: flex; justify-content: center; align-items: center;
        }

        .address-label { font-size: 14px; color: var(--text-sub); margin-bottom: 8px; }
        .address-text { font-size: 16px; color: var(--text-main); font-weight: 600; word-break: break-all; line-height: 1.5; padding: 0 10px;}

        /* ===== 底部 imToken 栏 (100% 还原) ===== */
        .footer-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px 6px 14px; 
        }

        .footer-left { display: flex; align-items: center; }

        /* 使用 Base64 图片，彻底解决 SVG 截图变形问题 */
        .footer-logo {
            width: 36px; height: 36px; margin-right: 12px;
            object-fit: contain;
        }

        .footer-text h4 { font-size: 19px; font-weight: 500; color: #fff; margin-bottom: 2px; line-height: 1.2; letter-spacing: 0.5px;}
        .footer-text p { font-size: 13px; color: rgba(255, 255, 255, 0.85); line-height: 1.2; letter-spacing: 0.5px;}

        /* 右下角二维码 */
        .footer-qr {
            background: #fff; padding: 3px; border-radius: 8px; width: 52px; height: 52px;
            display: flex; justify-content: center; align-items: center;
        }
        .footer-qr img { width: 100%; height: 100%; display: block; border-radius: 5px; }
    </style>
</head>

    <script>
        const mainQrContainer = document.getElementById('mainQrContainer');
        const saveBtn = document.getElementById('saveBtn');
        const cardCapture = document.getElementById('cardCapture');

        // 生成大二维码
        function generateMainQRCode(text) {
            if (!text) return;
            mainQrContainer.innerHTML = '';
            new QRCode(mainQrContainer, {
                text: text, 
                width: 220, 
                height: 220, 
                colorDark : "#000000", 
                colorLight : "#ffffff", 
                correctLevel : QRCode.CorrectLevel.H
            });
            // 保证二维码居中
            mainQrContainer.style.display = 'flex';
            mainQrContainer.style.justifyContent = 'center';
            mainQrContainer.style.alignItems = 'center';
        }

        // 监听输入更新内容
        document.getElementById('qrContentInput').addEventListener('input', (e) => generateMainQRCode(e.target.value.trim()));
        document.getElementById('addressInput').addEventListener('input', (e) => { 
            document.getElementById('displayAddress').innerText = e.target.value.trim(); 
        });

        // 截图并保存 (使用 html-to-image 保证 SVG 内嵌图片不会变形)
        saveBtn.addEventListener('click', function() {
            const originalText = saveBtn.innerText;
            saveBtn.innerText = '正在生成图片...';
            saveBtn.disabled = true;

            // pixelRatio: 4 保证生成的图片非常高清
            htmlToImage.toPng(cardCapture, { pixelRatio: 4, backgroundColor: null })
                .then(function (dataUrl) {
                    const link = document.createElement('a');
                    link.download = 'Tron_完美收款卡片.png';
                    link.href = dataUrl;
                    link.click();
                    
                    saveBtn.innerText = originalText;
                    saveBtn.disabled = false;
                })
                .catch(function (error) {
                    console.error('截图失败:', error);
                    alert('生成失败，请确保网络畅通并重试。');
                    saveBtn.innerText = originalText;
                    saveBtn.disabled = false;
                });
        });

        // 页面加载时默认生成
        window.onload = () => {
            generateMainQRCode(document.getElementById('qrContentInput').value);
        };
    </script>
